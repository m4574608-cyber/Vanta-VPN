name: VANTA VPN Bot Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Run bot for 5 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 300 python main.py || [ $? -eq 124 ]
